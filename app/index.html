<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel — Millán Academy</title>
<link rel="icon" href="../assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="../assets/css/brand.css" />
<link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-camera"><path d="M4 8.6c0-1 .8-1.9 1.9-1.9h1.3l1.1-1.8h7.4l1.1 1.8h1.3c1 0 1.9.9 1.9 1.9v9.6c0 1-.9 1.9-1.9 1.9H5.9A1.9 1.9 0 0 1 4 18.2V8.6Z"/><circle cx="12" cy="13.1" r="3.6"/></g>
    <g id="i-dashboard"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.4"/><rect x="13" y="3.5" width="7.5" height="4.5" rx="1.4"/><rect x="13" y="10" width="7.5" height="10.5" rx="1.4"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.4"/></g>
    <g id="i-users"><path d="M9 11.2a3.1 3.1 0 1 0 0-6.2 3.1 3.1 0 0 0 0 6.2Z"/><path d="M3.6 19.2c.4-3 2.7-4.5 5.4-4.5s5 1.5 5.4 4.5"/><path d="M15.5 5.4a3 3 0 0 1 .3 6M17.6 14.9c2.3.3 4 1.8 4.4 4.3"/></g>

    <g id="i-play"><rect x="3.2" y="5" width="17.6" height="14" rx="2.4"/><path d="M10 9.2 15 12l-5 2.8V9.2Z" fill="currentColor" stroke="none"/></g>
    <g id="i-chart"><path d="M4 4v16h16"/><path d="M8.5 20v-5M13 20v-9M17.5 20v-3.5"/></g>
    <g id="i-card"><rect x="3" y="6" width="18" height="12" rx="2.4"/><path d="M3 10h18"/></g>
    <g id="i-plus"><path d="M12 4v16M4 12h16"/></g>
    <g id="i-back"><path d="M14.5 4.5 6 12l8.5 7.5"/></g>
    <g id="i-check"><path d="M4 12.5 9 17l11-11"/></g>
    <g id="i-x"><path d="M5 5l14 14M19 5 5 19"/></g>
    <g id="i-globe"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 4 5.3 4 8.5s-1.4 6.1-4 8.5c-2.6-2.4-4-5.3-4-8.5s1.4-6.1 4-8.5Z"/></g>
    <g id="i-refresh"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M17 3v4h-4M7 21v-4h4" fill="none"/></g>

</svg>

<div class="shell">
  <aside class="side">
    <a class="side-brand" href="../">
      <img src="../assets/img/emblem-128.png" alt="" />
      <span>MILLÁN<br/>ACADEMY</span>
    </a>
    <nav id="sidenav" class="side-nav">
      <!-- inyectado por app.js -->
    </nav>
    <a class="side-back" href="../">
      <svg viewBox="0 0 24 24"><use href="#i-back"/></svg>
      Volver al sitio
    </a>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div>
        <div class="topbar-eyebrow">Panel interno · demo local</div>
        <h1 id="pageTitle" class="topbar-title">Panel</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="resetDemo" title="Vuelve los datos de ejemplo a su estado inicial">
          <svg viewBox="0 0 24 24" width="15" height="15"><use href="#i-refresh"/></svg>
          Reiniciar datos de ejemplo
        </button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<script type="module" src="../assets/js/app.js"></script>
</body>
</html>
